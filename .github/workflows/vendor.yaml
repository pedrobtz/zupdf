on:
  push:
    branches: [main, master]
  pull_request:

name: vendor

permissions:
  contents: read

jobs:
  # src/vendor/pdfio is pdfio's release tarball plus exactly the patch series
  # in tools/patches/, and is never edited in place. tools/verify-vendor
  # re-derives it and fails on any difference; the PR guard then requires a
  # change under src/vendor to come through tools/update-pdfio, which
  # rewrites the provenance record. A version bump also fails test-info.R's
  # literal until that is updated.
  vendor:
    uses: pedrobtz/r-actions/.github/workflows/vendor.yml@v1
    with:
      verify: tools/verify-vendor
      must-update: |
        src/vendor/PROVENANCE

  # R CMD check NOTEs a shared object that references stdout/stderr, printf,
  # abort, exit, assert or rand, and design section 4 allows no export but
  # R_init_zupdf. Checked on a plain R CMD INSTALL build, which compiles with
  # R's -DNDEBUG as CRAN does. Both gates' canaries run first, so a gate that
  # cannot fail is noticed.
  symbols:
    runs-on: ubuntu-latest
    name: only R_init_zupdf; no console, exit or RNG symbols
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
      - name: Canaries
        run: |
          tools/check-symbols --canary
          tools/verify-vendor --canary
      - name: Install and inspect the shared object
        run: |
          mkdir -p "$RUNNER_TEMP/lib"
          R CMD INSTALL --no-test-load -l "$RUNNER_TEMP/lib" .
          tools/check-symbols "$RUNNER_TEMP/lib/zupdf/libs/zupdf.so"
