# Roadmap Stage 7: zupdf against pdftools and qpdf (design section 15).
# Text and word positions against pdftools, the compatibility layer's values,
# every file zupdf writes opened by pdftools and qpdf and passed by
# `qpdf --check`, and deterministic bytes identical twice over, with their
# MD5 and zlib version printed for comparison across runners. Benchmarks
# run after, informational.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: conformance

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ${{ matrix.os }}
    name: conformance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install the qpdf command line
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y qpdf; else brew install qpdf; fi
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pdftools, any::qpdf, local::.
      - name: Conformance
        run: tools/run-conformance
      - name: Benchmarks
        run: tools/run-benchmarks
